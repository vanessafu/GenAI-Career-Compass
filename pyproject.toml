[project]
name = "genai-career-compass"
version = "0.1.0"
description = "AI-powered career exploration and role-matching tool"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    # AI APIs
    "openai>=1.40.0",
    # Embedding and retrieval
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
    # PDF parsing
    "pypdf>=5.0.0",
    # Database
    "pgvector>=0.3.0",
    "psycopg2-binary>=2.9.0",
]

[project.optional-dependencies]
catalog = ["google-genai>=0.3.0"]

[dependency-groups]
dev = ["httpx>=0.27.0", "pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests", "metrics"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
