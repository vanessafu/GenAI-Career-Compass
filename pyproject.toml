[project]
name = "genai-career-compass"
version = "0.1.0"
description = "AI-powered career exploration and role-matching tool"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
    "pymupdf>=1.24.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.1.0",
    "pgvector>=0.3.0",
]

[project.scripts]
career-compass = "backend.app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
