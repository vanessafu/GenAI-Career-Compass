[project]
name = "genai-career-compass"
version = "0.1.0"
description = "AI-powered career exploration and role-matching tool"
requires-python = ">=3.11"
dependencies = [
    # Web Framework & ASGI Server
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    # HTTP Client & OpenAI API
    "httpx>=0.27.0",
    "openai>=1.40.0",
    # Embedding & retrieval
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    "flashrank>=0.2.9",
    # Data loading & processing
    "pandas>=2.0.0",
    "huggingface-hub>=0.23.0",
    "pymupdf>=1.24.0",
    "gitpython>=3.1.0",
    # Database & BaaS (Supabase)
    "supabase>=2.4.0",              
    "pgvector>=0.3.0",
    "psycopg2-binary>=2.9.0",
]

[project.scripts]
career-compass = "backend.app.cli:main"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
